apiVersion: apps/v1
kind: Deployment

metadata:
  name: alert-service
  namespace: hackathon

spec:
  replicas: 2

  selector:
    matchLabels:
      app: alert-service

  template:
    metadata:
      labels:
        app: alert-service

    spec:
      containers:
      - name: alert-service

        image: 784369107852.dkr.ecr.ap-south-1.amazonaws.com/alert-service:latest

        imagePullPolicy: Always

        ports:
        - containerPort: 8091

        env:
        - name: DB_HOST
          value: mysql

        - name: DB_PORT
          value: "3306"

        - name: DB_NAME
          value: hackathon

        - name: DB_USERNAME
          value: admin

        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: password
